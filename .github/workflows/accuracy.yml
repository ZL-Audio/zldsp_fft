name: Accuracy Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build_and_test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest

    steps:
      - name: Checkout zldsp_fft (Library)
        uses: actions/checkout@v6
        with:
          path: zldsp_fft

      - name: Checkout zldsp_fft_develop (Benchmarks)
        uses: actions/checkout@v6
        with:
          repository: ZL-Audio/zldsp_fft_develop
          path: zldsp_fft_develop
          submodules: recursive

      - name: Inject Library into Benchmarks
        shell: bash
        run: |
          rm -rf zldsp_fft_develop/zldsp_fft
          cp -R zldsp_fft/src zldsp_fft_develop/zldsp_fft

      - name: Check benchmark result parsing
        working-directory: zldsp_fft_develop
        run: python -m unittest discover -s benchmark/tests

      - name: Show CPU Info (Linux)
        if: runner.os == 'Linux'
        run: lscpu

      - name: Show CPU Info (macOS)
        if: runner.os == 'macOS'
        run: sysctl -n machdep.cpu.brand_string

      - name: Show CPU Info (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-CimInstance -ClassName Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

      - name: CFFT Library and API Agreement AVX2 Double (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: zldsp_fft_develop
        run: |
          python -u benchmark/run.py accuracy cfft 2 20 --avx2 --double
          python -u benchmark/run.py accuracy cfft 2 20 --apis --avx2 --double

      - name: CFFT Library and API Agreement AVX2 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: zldsp_fft_develop
        run: |
          python -u benchmark/run.py accuracy cfft 2 20 --avx2
          python -u benchmark/run.py accuracy cfft 2 20 --apis --avx2

      - name: CFFT Library and API Agreement Double
        shell: bash
        working-directory: zldsp_fft_develop
        run: |
          python -u benchmark/run.py accuracy cfft 2 20 --double
          python -u benchmark/run.py accuracy cfft 2 20 --apis --double

      - name: CFFT Library and API Agreement
        shell: bash
        working-directory: zldsp_fft_develop
        run: |
          python -u benchmark/run.py accuracy cfft 2 20
          python -u benchmark/run.py accuracy cfft 2 20 --apis

      - name: RFFT Library and API Agreement AVX2 Double (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: zldsp_fft_develop
        run: |
          python -u benchmark/run.py accuracy rfft 2 20 --avx2 --double
          python -u benchmark/run.py accuracy rfft 2 20 --apis --avx2 --double

      - name: RFFT Library and API Agreement AVX2 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: zldsp_fft_develop
        run: |
          python -u benchmark/run.py accuracy rfft 2 20 --avx2
          python -u benchmark/run.py accuracy rfft 2 20 --apis --avx2

      - name: RFFT Library and API Agreement Double
        shell: bash
        working-directory: zldsp_fft_develop
        run: |
          python -u benchmark/run.py accuracy rfft 2 20 --double
          python -u benchmark/run.py accuracy rfft 2 20 --apis --double

      - name: RFFT Library and API Agreement
        shell: bash
        working-directory: zldsp_fft_develop
        run: |
          python -u benchmark/run.py accuracy rfft 2 20
          python -u benchmark/run.py accuracy rfft 2 20 --apis
