name: Accuracy Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux SSE2
            os: ubuntu-latest
            flags: --sse2
          - name: Linux AVX2
            os: ubuntu-latest
            flags: --avx2
          - name: macOS
            os: macos-latest
            flags: ''

    defaults:
      run:
        shell: bash
        working-directory: zldsp_fft_develop

    steps:
      - name: Checkout zldsp_fft (Library)
        uses: actions/checkout@v6
        with:
          path: zldsp_fft

      - name: Checkout zldsp_fft_develop (Benchmarks)
        uses: actions/checkout@v6
        with:
          repository: ZL-Audio/zldsp_fft_develop
          ref: main
          path: zldsp_fft_develop
          submodules: recursive

      - name: Inject Library into Benchmarks
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf zldsp_fft_develop/zldsp_fft
          cp -R zldsp_fft/src zldsp_fft_develop/zldsp_fft

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Show build tools
        run: |
          python --version
          cmake --version
          ninja --version
          clang++ --version

      - name: Show CPU Info (Linux)
        if: runner.os == 'Linux'
        run: lscpu

      - name: Show CPU Info (macOS)
        if: runner.os == 'macOS'
        run: sysctl -n machdep.cpu.brand_string

      - name: CFFT float library and API agreement
        run: |
          python -u benchmark/run.py accuracy cfft 2 20 ${{ matrix.platform.flags }}
          python -u benchmark/run.py accuracy cfft 2 20 --apis ${{ matrix.platform.flags }}

      - name: CFFT double library and API agreement
        run: |
          python -u benchmark/run.py accuracy cfft 2 20 --double ${{ matrix.platform.flags }}
          python -u benchmark/run.py accuracy cfft 2 20 --apis --double ${{ matrix.platform.flags }}

      - name: RFFT float library and API agreement
        run: |
          python -u benchmark/run.py accuracy rfft 2 20 ${{ matrix.platform.flags }}
          python -u benchmark/run.py accuracy rfft 2 20 --apis ${{ matrix.platform.flags }}

      - name: RFFT double library and API agreement
        run: |
          python -u benchmark/run.py accuracy rfft 2 20 --double ${{ matrix.platform.flags }}
          python -u benchmark/run.py accuracy rfft 2 20 --apis --double ${{ matrix.platform.flags }}
